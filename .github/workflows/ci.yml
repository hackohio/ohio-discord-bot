name: Build and Code Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Install and validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true

      - name: Install project environment
        run: uv sync --locked

      - name: Check dependency consistency
        run: uv pip check

      - name: Check Python syntax
        run: uv run python -m compileall -q .
