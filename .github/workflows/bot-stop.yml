name: Stop bot

# Stops the Lightsail server without deleting the instance or its data.
# Run from the Actions tab: "Stop bot" -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      event:
        description: GitHub environment deployed by Start bot
        type: environment
        required: true

permissions:
  contents: read

concurrency:
  group: bot-infra-${{ inputs.event }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  EVENT: ${{ inputs.event }}
  INSTANCE_NAME: ohio-discord-bot-${{ inputs.event }}

jobs:
  stop:
    name: Stop server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.event }}

    steps:
      - name: Validate event name
        run: |
          if [[ ! "$EVENT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Event must contain only lowercase letters, numbers, and hyphens."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop server
        run: |
          state="$(aws lightsail get-instance-state --instance-name "$INSTANCE_NAME" --query 'state.name' --output text)"
          case "$state" in
            stopped)
              echo "Server is already stopped."
              exit 0
              ;;
            stopping)
              ;;
            running)
              aws lightsail stop-instance --instance-name "$INSTANCE_NAME"
              ;;
            *)
              echo "::error::Cannot safely stop server from state: $state"
              exit 1
              ;;
          esac

          for attempt in {1..30}; do
            state="$(aws lightsail get-instance-state --instance-name "$INSTANCE_NAME" --query 'state.name' --output text)"
            [ "$state" = "stopped" ] && exit 0
            sleep 10
          done
          echo "::error::Server did not stop within five minutes."
          exit 1

      - name: Summary
        run: |
          echo "## Bot stopped" >> "$GITHUB_STEP_SUMMARY"
          echo "The Lightsail server for \`${EVENT}\` has been stopped. The instance and its data were preserved." >> "$GITHUB_STEP_SUMMARY"
