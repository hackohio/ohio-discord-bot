# Turns a blank Ubuntu Lightsail server into a running bot.
# The "Start bot" GitHub workflow runs this; it can also be run by hand from
# Linux/WSL:
#   CONFIG_INI="$(cat config.ini)" ansible-playbook -i inventory.ini playbook.yml -e web_port=5000 -e public_ip=203.0.113.10

- name: Deploy OHI/O Discord bot
  hosts: bot
  become: true

  vars:
    app_user: bot
    app_home: /var/lib/ohio-bot
    app_dir: /opt/ohio-discord-bot
    repo_url: https://github.com/hackohio/ohio-discord-bot.git
    repo_ref: main
    uv_version: "0.12.5" # keep in sync with .github/workflows/ci.yml
    caddy_version: "2.11.4" # includes public IP certificate support
    web_port: 5000
    public_ip: ""
    config_ini: "{{ lookup('ansible.builtin.env', 'CONFIG_INI') }}"
    restore_db_file: "" # path on the machine running Ansible; empty = start with a fresh database

  pre_tasks:
    - name: Wait for the new server to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for first-boot setup (cloud-init) to finish
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2] # 2 = finished with non-fatal warnings

    - name: Make sure deployment inputs were provided
      ansible.builtin.assert:
        that:
          - config_ini | length > 0
          - public_ip | length > 0
        fail_msg: CONFIG_INI and public_ip are required deployment inputs.
        quiet: true

  tasks:
    # The nano plan has 0.5 GB RAM and start.py runs two Python processes, so
    # add swap as a safety net against out-of-memory crashes.
    - name: Create 1 GB swap file
      ansible.builtin.shell: |
        fallocate -l 1G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
      args:
        creates: /swapfile

    - name: Keep swap enabled after reboot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"

    - name: Install system packages
      ansible.builtin.apt:
        name: [git, acl, sqlite3, ca-certificates, python3-debian]
        update_cache: true
        lock_timeout: 300 # first boot often runs unattended-upgrades, which holds the apt lock

    - name: Add the official Caddy package repository
      ansible.builtin.deb822_repository:
        name: caddy-stable
        types: [deb]
        uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
        suites: any-version
        components: [main]
        signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
      register: caddy_repository

    - name: Install Caddy
      ansible.builtin.apt:
        name: "caddy={{ caddy_version }}"
        state: present
        update_cache: "{{ caddy_repository.changed }}"
        lock_timeout: 300

    - name: Configure HTTPS for the webhook IP address
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: caddy
        mode: "0644"
      notify: Restart Caddy

    - name: Validate the Caddy configuration
      ansible.builtin.command: caddy validate --config /etc/caddy/Caddyfile
      changed_when: false

    - name: Install uv
      ansible.builtin.unarchive:
        src: "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
        remote_src: true
        dest: /usr/local/bin
        extra_opts: [--strip-components=1]
        creates: /usr/local/bin/uv

    - name: Create the bot user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        home: "{{ app_home }}"
        create_home: true
        shell: /usr/sbin/nologin

    - name: Create the app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Check out the bot code
      become_user: "{{ app_user }}"
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_ref }}"
        force: true
      notify: Restart bot

    - name: Write config.ini
      ansible.builtin.copy:
        content: "{{ config_ini }}\n"
        dest: "{{ app_dir }}/config.ini"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
      no_log: true
      notify: Restart bot

    - name: Restore records.db from backup
      when: restore_db_file | length > 0
      block:
        - name: Stop the bot before replacing its database
          ansible.builtin.systemd_service:
            name: ohio-bot
            state: stopped
          failed_when: false # not installed yet on a fresh server

        - name: Upload records.db
          ansible.builtin.copy:
            src: "{{ restore_db_file }}"
            dest: "{{ app_dir }}/records.db"
            owner: "{{ app_user }}"
            group: "{{ app_user }}"
            mode: "0600"
          notify: Restart bot

    - name: Install Python and dependencies from uv.lock
      become_user: "{{ app_user }}"
      ansible.builtin.command: /usr/local/bin/uv sync --locked
      args:
        chdir: "{{ app_dir }}"
      environment:
        HOME: "{{ app_home }}"
      register: uv_sync
      changed_when: "'Installed' in uv_sync.stderr"

    - name: Install the systemd service
      ansible.builtin.template:
        src: templates/ohio-bot.service.j2
        dest: /etc/systemd/system/ohio-bot.service
        mode: "0644"
      notify: Restart bot

    - name: Enable and start the bot
      ansible.builtin.systemd_service:
        name: ohio-bot
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable and start Caddy
      ansible.builtin.systemd_service:
        name: caddy
        enabled: true
        state: started

    - name: Apply pending restarts
      ansible.builtin.meta: flush_handlers

    - name: Wait for the webhook to start listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ web_port }}"
        timeout: 120

    - name: Confirm the service is still running
      ansible.builtin.command: systemctl is-active ohio-bot
      changed_when: false

  handlers:
    - name: Restart bot
      ansible.builtin.systemd_service:
        name: ohio-bot
        state: restarted
        daemon_reload: true

    - name: Restart Caddy
      ansible.builtin.systemd_service:
        name: caddy
        state: restarted
