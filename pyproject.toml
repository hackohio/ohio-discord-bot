[project]
name = "ohio-discord-bot"
version = "0.1.0"
description = "Discord bot and registration webhook for the OHI/O hackathon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py",
    "Flask",
    "openpyxl",
    "pandas",
    "waitress>=3.0.2",
    "XlsxWriter",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", ".venv", "logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
